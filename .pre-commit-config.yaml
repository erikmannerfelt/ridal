repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
    # `assets/vendor/` is overwritten wholesale by scripts/vendor_leaflet.sh
    # on every refresh, so a byte-for-byte upstream file (missing a
    # trailing newline, as leaflet.js ships) would just fail this again
    # next time someone updates the vendored version -- vendored content
    # isn't ours to reformat.
    exclude: \.txt$|^src/server/assets/vendor/
  - id: trailing-whitespace                # Remove trailing whitespaces
    exclude: ^src/server/assets/vendor/
  - id: check-merge-conflict
  - id: check-added-large-files
    args: [--maxkb=2000]
    # Real MALA fixtures needed for the web GUI's integration tests
    # (#115) -- deliberately committed, not an accidental large add.
    exclude: ^assets/mala/
  - id: detect-private-key
  - id: sort-simple-yaml

# Fix common spelling mistakes
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    args: []
    types_or: [rust, markdown]
    #files: ^(src||tests)/

- repo: https://github.com/lovesegfault/beautysh
  rev: v6.4.2
  hooks:
  - id: beautysh

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: https://github.com/nix-community/nixpkgs-fmt
  rev: v1.3.0
  hooks:
  - id: nixpkgs-fmt

- repo: local
  hooks:
  - id: check-steps-md
    name: Check steps.md structure
    entry: scripts/check_steps_md.py
    language: system
    files: ^steps\.md$
