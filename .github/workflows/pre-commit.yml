name: Linting and formatting (pre-commit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push to a pull request cancels the run for its previous commit.
  # Everything else gets a group of its own, so each commit on main, and
  # each tag, runs to the end.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
    - uses: pre-commit/action@v3.0.1
