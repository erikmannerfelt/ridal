name: Build & publish Python wheels

on:
  push:
    branches: [main]
    tags:
    - v*
  pull_request:
    branches: [main]
    paths:
    - src/**
    - pyproject.toml
    - Cargo.toml
    - Cargo.lock
    - .github/workflows/python.yml
    - .github/workflows/python-build.yml
    - test_ridal_interface.py
    - python/**
    - tests/**
    - docs/**
    - .readthedocs.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build PR (ubuntu / python 3.12)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/python-build.yml
    with:
      os: ubuntu-latest
      python-version: '3.12'

  dry-run-publish:
    name: Dry-run publish
    needs: build-pr
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        path: wheels

    - name: Dry-run publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        pip install uv
        uv publish --dry-run wheels/**/*.whl

  docs-pr:
    name: Build the documentation
    needs: build-pr
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # The wheel this PR builds, so the Python reference is the PR's own.
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest-py3.12
        path: wheels

    - name: Build with warnings as errors
      run: |
        pip install -r docs/requirements.txt wheels/*.whl
        sphinx-build -W --keep-going -b html docs docs/_build/html

  # The HTTP client's tests against real servers (#328). The wheel has no
  # server in it, so this builds the `ridal` command as well, and installs
  # PROJ to process the fixture radargram the tests serve.
  client-integration:
    name: Python client against a real server
    needs: build-pr
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Install PROJ
      run: |
        sudo apt update -y
        sudo apt install -y proj-bin

    - name: Build the ridal command
      run: cargo build --no-default-features -F cli,server

    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest-py3.12
        path: wheels

    - name: Install the wheel with the client
      run: |
        pip install pytest pandas geopandas
        whl=$(ls wheels/*.whl)
        pip install "${whl}[client]"

    - name: Test
      env:
        RIDAL_BIN: target/debug/ridal
      run: python -m pytest tests/client -v

  build-all:
    name: Build all platforms
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/python-build.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    strategy:
      # This matrix feeds the PyPI publish, so a cancelled sibling is a
      # half-built release rather than only a lost test result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ['3.11', '3.12', '3.13', '3.14']

  publish:
    name: Publish to PyPI
    needs: build-all
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: wheels

    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        pip install uv
        uv publish --check-url https://pypi.org/simple/ wheels/**/*.whl

  # Read the Docs cannot build `ridal` itself (it would compile HDF5), so the
  # documentation installs the wheel CI built for the same commit, which this
  # keeps in the `docs-wheels` release as `<commit>.whl` (#345, #359). Read
  # the Docs waits for it; see docs/install_ridal.py.
  docs-wheel:
    name: Publish the wheel the documentation uses
    needs: [build-pr, build-all]
    runs-on: ubuntu-latest
    # A fork's pull request gets no token that can write to the release, and
    # its documentation falls back to main's wheel.
    if: >-
      !cancelled() && github.event_name != 'workflow_dispatch'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The commit Read the Docs builds: a pull request's head, not the merge
      # commit that `github.sha` names for it.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheels-ubuntu-latest-py3.12
        path: wheels

    - name: Upload the wheel to the docs-wheels release
      run: |
        if ! gh release view docs-wheels > /dev/null 2>&1; then
          gh release create docs-wheels --prerelease --target main \
            --title "Wheels for the documentation" \
            --notes "Not a release. CI uploads a wheel here for every commit it builds, named after the commit, for the documentation build to install. Wheels older than 30 days are removed." \
            || gh release view docs-wheels > /dev/null
        fi
        cp wheels/*.whl "$COMMIT.whl"
        gh release upload docs-wheels "$COMMIT.whl" --clobber
        if [ "$GITHUB_REF" = refs/heads/main ]; then
          cp wheels/*.whl main.whl
          gh release upload docs-wheels main.whl --clobber
        fi

    - name: Remove wheels older than 30 days
      run: |
        cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
        gh release view docs-wheels --json assets \
          --jq ".assets[] | select(.name != \"main.whl\" and .updatedAt < \"$cutoff\") | .name" \
          | while read -r asset; do
              gh release delete-asset docs-wheels "$asset" --yes
            done
