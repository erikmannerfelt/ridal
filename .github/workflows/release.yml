name: GitHub Release

on:
  push:
    tags:
    - v*

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    # Creating a release writes to the repository.
    permissions:
      contents: write

    steps:
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
